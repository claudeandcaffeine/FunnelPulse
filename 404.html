<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | FunnelPulse</title>
  <meta name="description" content="Page not found on FunnelPulse.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:#000;color:#fff;line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
    .container{max-width:600px;margin:auto;padding:40px 24px;text-align:center}
    .badge{display:inline-block;font-size:12px;font-weight:700;color:#FF453A;background:rgba(255,69,58,0.1);border:1px solid rgba(255,69,58,0.2);padding:4px 12px;border-radius:100px;margin-bottom:20px;text-transform:uppercase;letter-spacing:1px}
    h1{font-size:64px;font-weight:800;letter-spacing:-2px;margin-bottom:12px;line-height:1}
    p{color:#8E8E93;font-size:16px;margin-bottom:32px}
    .btn{display:inline-block;background:#fff;color:#000;padding:12px 28px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;transition:opacity .2s}
    .btn:hover{opacity:0.85}
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">404 Error</div>
    <h1>Lost in the Funnel?</h1>
    <p>The page you are looking for does not exist or has been moved. Let's get you back on track.</p>
    <a href="index.html" class="btn">← Back to Homepage</a>
  </div>
</body>
</html>
