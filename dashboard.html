<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funnel Diagnostics & Comparison</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --surface: rgba(255,255,255,0.06);
    --surface-hover: rgba(255,255,255,0.09);
    --border: rgba(255,255,255,0.08);
    --healthy: #30D158;
    --watch: #FFD60A;
    --critical: #FF453A;
    --neutral: #8E8E93;
    --text-primary: #FFFFFF;
    --text-secondary: #AEAEB2;
    --text-tertiary: #636366;
    --accent: #0A84FF;
    --accent-glow: rgba(10,132,255,0.2);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--font);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .app-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .app-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #0A84FF, #30D158);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
  }

  .logo-text {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  /* Campaign tabs */
  .campaign-tabs {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 8px;
  }
  .campaign-tabs::-webkit-scrollbar { display: none; }

  .tab-item-wrap {
    display: flex;
    align-items: center;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 20px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .tab-item-wrap.active {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.15);
  }
  .tab-item-wrap:hover:not(.active) {
    background: var(--surface);
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tab-item-wrap.active .tab-btn { color: var(--text-primary); font-weight: 600; }
  .tab-item-wrap:hover .tab-btn { color: var(--text-primary); }

  .tab-delete-btn {
    background: transparent;
    border: none;
    color: var(--text-tertiary);
    font-size: 14px;
    line-height: 1;
    padding: 6px 8px 6px 0;
    cursor: pointer;
    border-radius: 50%;
    transition: color 0.2s ease;
  }
  .tab-delete-btn:hover { color: var(--critical); }

  .campaign-name {
    outline: none;
    border-radius: 4px;
    padding: 1px 3px;
    cursor: text;
    min-width: 20px;
    display: inline-block;
  }
  .campaign-name:focus {
    background: rgba(10,132,255,0.15);
    box-shadow: 0 0 0 1px rgba(10,132,255,0.4);
  }

  .period-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 16px;
    flex-wrap: wrap;
  }

  .period-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--text-tertiary);
    letter-spacing: 0.5px;
  }

  .period-dropdown {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 13px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .period-dropdown:hover {
    border-color: rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
  }

  .period-nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .period-nav-btn:hover {
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.2);
  }

  .btn-add-period {
    background: transparent;
    border: 1px solid rgba(10,132,255,0.4);
    color: var(--accent);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-add-period:hover {
    background: rgba(10,132,255,0.1);
    border-color: rgba(10,132,255,0.6);
  }

  .trend-indicator {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(255,255,255,0.04);
  }
  .trend-indicator.up { color: var(--healthy); }
  .trend-indicator.down { color: var(--critical); }
  .trend-indicator.flat { color: var(--neutral); }

  .btn-export {
    background: rgba(48,209,88,0.1);
    border: 1px solid rgba(48,209,88,0.3);
    color: var(--healthy);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-export:hover {
    background: rgba(48,209,88,0.2);
    color: #fff;
    border-color: rgba(48,209,88,0.5);
  }

  /* Print styles */
  @media print {
    body { background: #fff !important; color: #000 !important; }
    .app-header, .input-section, .period-selector, footer, .btn-export, .btn-clear, .btn-add-campaign, .tab-delete-btn, .compare-hero button { display: none !important; }
    .main { padding: 0 !important; max-width: 100% !important; }
    .campaign-hero { margin-bottom: 16px !important; }
    .funnel-bar { flex-wrap: wrap !important; }
    .funnel-stage-pill { border: 1px solid #ccc !important; }
    .metric-tile { background: #f5f5f5 !important; border: 1px solid #ddd !important; }
    .metric-value { color: #000 !important; }
    .diagnosis-panel { background: #f9f9f9 !important; border: 1px solid #ddd !important; }
    .diagnosis-title, .diagnosis-explanation, .diagnosis-action { color: #333 !important; }
    .findings-title { color: #000 !important; }
    .section-label { color: #666 !important; }
    .health-score-badge { background: #eee !important; border: 1px solid #ccc !important; }
    .metrics-grid { grid-template-columns: repeat(3, 1fr) !important; }
  }

  .compare-tab-btn {
    background: rgba(10,132,255,0.1);
    border: 1px solid rgba(10,132,255,0.3);
    color: var(--accent);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .compare-tab-btn:hover {
    background: rgba(10,132,255,0.2);
    color: #fff;
    border-color: rgba(10,132,255,0.5);
  }
  .compare-tab-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .btn-add-campaign {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-add-campaign:hover:not(:disabled) { color: var(--text-primary); border-color: rgba(255,255,255,0.2); }
  .btn-add-campaign:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-style: dashed;
  }

  /* ── MAIN LAYOUT ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* ── CAMPAIGN HERO ── */
  .campaign-hero {
    margin-bottom: 28px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .campaign-title-wrap { display: flex; flex-direction: column; gap: 4px; }

  .campaign-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .campaign-meta {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .health-score-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 18px;
    backdrop-filter: blur(20px);
  }

  .health-score-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .health-score-value {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    transition: color 0.3s ease;
  }

  /* ── FUNNEL HEALTH BAR ── */
  .funnel-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .funnel-stage-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 16px;
    flex: 1;
    min-width: 140px;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .funnel-stage-pill:hover { background: var(--surface-hover); }

  .funnel-stage-pill.critical {
    border-color: rgba(255,69,58,0.4);
    animation: pulse-critical 2s ease-in-out infinite;
  }
  .funnel-stage-pill.watch { border-color: rgba(255,214,10,0.3); }
  .funnel-stage-pill.healthy { border-color: rgba(48,209,88,0.2); }

  @keyframes pulse-critical {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,69,58,0); }
    50% { box-shadow: 0 0 0 4px rgba(255,69,58,0.15); }
  }

  .stage-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.3s ease;
  }

  .stage-info { flex: 1; min-width: 0; }

  .stage-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
    display: block;
  }

  .stage-status {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .funnel-arrow {
    color: var(--text-tertiary);
    font-size: 16px;
    flex-shrink: 0;
  }

  /* ── INPUT SECTION ── */
  .input-section {
    margin-bottom: 36px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 28px;
    backdrop-filter: blur(20px);
  }

  .input-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    cursor: pointer;
  }

  .input-section-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .collapse-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 20px;
    line-height: 1;
    padding: 4px;
    transition: transform 0.2s ease;
  }
  .collapse-btn.collapsed { transform: rotate(-90deg); }

  .input-body { transition: all 0.3s ease; }

  .input-mode-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 3px;
    width: fit-content;
  }

  .mode-tab {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .mode-tab.active {
    background: rgba(255,255,255,0.1);
    color: var(--text-primary);
  }

  /* Form grid */
  .form-stage { margin-bottom: 20px; }

  .form-stage-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 10px;
    display: block;
  }

  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }

  .form-field { position: relative; display: flex; flex-direction: column; gap: 5px; }

  .form-label-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .form-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  .formula-hint {
    font-size: 10px;
    color: var(--text-tertiary);
    font-style: italic;
    letter-spacing: 0;
    text-transform: none;
    font-weight: 400;
  }

  .form-input {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: var(--font);
    font-size: 15px;
    font-weight: 500;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
    width: 100%;
  }
  .form-input:focus {
    border-color: rgba(10,132,255,0.6);
    background: rgba(10,132,255,0.05);
  }
  .form-input::placeholder { color: var(--text-tertiary); }

  .form-input.auto-calc {
    color: var(--text-secondary);
    border-color: rgba(10,132,255,0.25);
    background: rgba(10,132,255,0.04);
    padding-right: 36px;
  }

  .auto-badge {
    position: absolute;
    right: 10px;
    bottom: 12px;
    font-size: 10px;
    color: var(--accent);
    opacity: 0.8;
    pointer-events: none;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* CSV section */
  .csv-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .csv-btn-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn-csv-action {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-csv-action:hover {
    background: rgba(255,255,255,0.1);
    color: var(--text-primary);
    border-color: rgba(255,255,255,0.2);
  }

  .csv-area {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-primary);
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 12.5px;
    padding: 16px;
    resize: vertical;
    min-height: 120px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .csv-area:focus { border-color: rgba(10,132,255,0.5); }

  .csv-hint {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 8px;
    line-height: 1.6;
  }

  /* CSV validation banner */
  .validation-banner {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .validation-banner.success {
    background: rgba(48,209,88,0.1);
    border: 1px solid rgba(48,209,88,0.3);
    color: #30D158;
  }
  .validation-banner.error {
    background: rgba(255,69,58,0.1);
    border: 1px solid rgba(255,69,58,0.3);
    color: #FF453A;
  }
  .validation-banner.warning {
    background: rgba(255,214,10,0.1);
    border: 1px solid rgba(255,214,10,0.3);
    color: #FFD60A;
  }

  .btn-analyze {
    margin-top: 16px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    padding: 11px 24px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-analyze:hover { background: #0071e3; transform: translateY(-1px); }

  .btn-clear {
    margin-top: 16px;
    margin-left: 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text-secondary);
    font-family: var(--font);
    font-size: 14px;
    font-weight: 500;
    padding: 11px 20px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-clear:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }

  /* ── METRICS GRID ── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 12px;
    margin-top: 24px;
  }
  #stage-awareness .section-label { margin-top: 0; }

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  @media (max-width: 900px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 500px) {
    .metrics-grid { grid-template-columns: 1fr; }
    .funnel-stage-pill { min-width: 0; }
    .funnel-arrow { display: none; }
  }

  .metric-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    transition: all 0.25s ease;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .metric-tile:hover { background: var(--surface-hover); }

  .metric-tile::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 16px 16px 0 0;
    background: transparent;
    transition: background 0.3s ease;
  }

  .metric-tile.critical::before { background: var(--critical); }
  .metric-tile.watch::before { background: var(--watch); }
  .metric-tile.healthy::before { background: var(--healthy); }

  .metric-tile-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .metric-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  .metric-status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--neutral);
    transition: background 0.3s ease;
  }

  .metric-value {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--text-primary);
    transition: all 0.3s ease;
    min-height: 40px;
  }
  .metric-value.empty { color: var(--text-tertiary); font-size: 24px; }

  .metric-subtitle {
    font-size: 12px;
    color: var(--text-tertiary);
    margin-top: 6px;
  }

  /* ── DIAGNOSIS PANEL ── */
  .findings-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .diagnosis-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 32px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .diagnosis-panel.has-critical {
    border-color: rgba(255,69,58,0.35);
    background: rgba(255,69,58,0.05);
  }

function normalizeCampaign(c) {
  if (!c.periods || !Array.isArray(c.periods) || c.periods.length === 0) {
    c.periods = [{
      startDate: new Date().toISOString().split('T')[0],
      endDate: new Date().toISOString().split('T')[0],
      metrics: c.metrics || {}
    }];
  }
  c.activePeriodIndex = c.activePeriodIndex || 0;
  return c;
}

// ── LOCALSTORAGE PERSISTENCE ───────────────────────────────────────────────
function saveToLocalStorage() {
  try {
    localStorage.setItem('funnelPulseData', JSON.stringify({
      campaigns,
      activeTab,
      campaignCounter,
      timestamp: new Date().toISOString()
    }));
  } catch(e) {
    console.warn('Could not save to localStorage:', e);
  }
}

function loadFromLocalStorage() {
  try {
    // 1. Check URL hash for share link
    if (handleShareHash()) return;
    // 2. Check query params for sample data
    if (handleQueryParams()) return;
    // 3. Fall back to localStorage
    const saved = localStorage.getItem('funnelPulseData');
    if (saved) {
      const data = JSON.parse(saved);
      if (data.campaigns) {
        campaigns = data.campaigns.map(normalizeCampaign);
      }
      activeTab = data.activeTab || 1;
      campaignCounter = data.campaignCounter || 1;
      console.log('Loaded data from', data.timestamp);
    }
  } catch(e) {
    console.warn('Could not load from localStorage:', e);
  }
}

function clearLocalStorage() {
  localStorage.removeItem('funnelPulseData');
}

const METRIC_DEFS = [
  // [key, label, stage, unit, benchmark_low, benchmark_high, format, description, higherIsBetter]
  ['impressions', 'Impressions', 'awareness',   '',   10000, 1e9,   'number',   'Total ad views', true],

const STAGES = [
  { key: 'awareness',  label: 'Awareness',  metrics: ['impressions','cpm','rpm'] },
  { key: 'interest',   label: 'Interest',   metrics: ['clicks','ctr','cpc'] },

// ── DIAGNOSTIC RULES ──────────────────────────────────────────────────────
const RULES = [
  // ── AWARENESS ──
  {
    id: 'high-cpm-low-ctr',
    severity: 'critical',
    stages: ['awareness','interest'],
    condition: m => has(m,'cpm','ctr') && m.cpm > 15 && m.ctr < 1,
    title: 'Expensive reach, wrong audience',
    explanation: m => `CPM is high at ${fmt(m.cpm,'currency')} but CTR is only ${fmt(m.ctr,'percent')}. You're paying a premium to reach people who don't care about your ad.`,
    action: 'Narrow your audience targeting or refresh the creative to match who you\'re paying to reach.',
    chips: ['CPM','CTR']
  },
  {
    id: 'low-cpm-low-ctr',
    severity: 'warning',
    stages: ['awareness','interest'],
    condition: m => has(m,'cpm','ctr') && m.cpm < 5 && m.ctr < 1,
    title: 'Cheap reach but ad not compelling',
    explanation: m => `CPM is fine at ${fmt(m.cpm,'currency')} — reach is affordable. But CTR of ${fmt(m.ctr,'percent')} means the creative isn't pulling clicks.`,

    chips: ['CPM','CTR']

    id: 'high-frequency-low-ctr',
    severity: 'warning',
    stages: ['awareness','interest'],
    condition: m => has(m,'impressions','clicks') && m.clicks > 0 && (m.impressions/m.clicks) > 200 && has(m,'ctr') && m.ctr < 1.5,

    explanation: m => `Low CTR of ${fmt(m.ctr,'percent')} with high impression volume suggests the same people are seeing your ad too many times.`,
    action: 'Rotate in fresh creative. Consider expanding your audience.',
    chips: ['Impressions','CTR']
  },
  {
    id: 'low-impressions-budget',
    severity: 'warning',
    stages: ['awareness'],
    condition: m => has(m,'impressions','cost') && m.impressions < 5000 && m.cost > 500,

    explanation: m => `Only ${fmt(m.impressions,'number')} impressions for ${fmt(m.cost,'currency')} spend. Your audience is too narrow or your bid is too low for the targeting.`,
    action: 'Check audience size, ad approval status, or raise your bid floor.',

// ── AUTO-CALC ENGINE ──────────────────────────────────────────────────────
const AUTO_CALC_RULES = [
  { key: 'ctr', hint: 'Clicks ÷ Impr × 100', requires: ['clicks','impressions'], formula: m => (m.clicks / m.impressions) * 100 },
  { key: 'cpc', hint: 'Cost ÷ Clicks', requires: ['cost','clicks'], formula: m => m.cost / m.clicks },
  { key: 'cpm', hint: 'Cost ÷ Impr × 1000', requires: ['cost','impressions'], formula: m => (m.cost / m.impressions) * 1000 },
  { key: 'rpm', hint: 'Rev ÷ Impr × 1000', requires: ['revenue','impressions'], formula: m => (m.revenue / m.impressions) * 1000 },
  { key: 'rpc', hint: 'Revenue ÷ Clicks', requires: ['revenue','clicks'], formula: m => m.revenue / m.clicks },
  { key: 'cvr', hint: 'Sales ÷ Clicks × 100', requires: ['sales','clicks'], formula: m => (m.sales / m.clicks) * 100 },
  { key: 'cpl', hint: 'Cost ÷ Sales', requires: ['cost','sales'], formula: m => m.cost / m.sales },
  { key: 'cpa', hint: 'Cost ÷ Sales', requires: ['cost','sales'], formula: m => m.cost / m.sales },
  { key: 'roas', hint: 'Revenue ÷ Cost', requires: ['revenue','cost'], formula: m => m.revenue / m.cost },
  { key: 'aov', hint: 'Revenue ÷ Sales', requires: ['revenue','sales'], formula: m => m.revenue / m.sales },
  { key: 'cac', hint: 'Cost ÷ Sales', requires: ['cost','sales'], formula: m => m.cost / m.sales },
];

let manualFields = {};

function getManualFields(campaignId) {
  const id = campaignId || activeTab;
  if (!manualFields[id]) manualFields[id] = {};
  return manualFields[id];
}

function getEffectiveMetrics(rawMetrics, campaignId) {
  const mf = manualFields[campaignId || activeTab] || {};
  const result = { ...rawMetrics };

  for (const rule of AUTO_CALC_RULES) {
    if (mf[rule.key]) continue;
    const allPresent = rule.requires.every(k =>
      rawMetrics[k] !== undefined && rawMetrics[k] !== '' &&
      !isNaN(rawMetrics[k]) && rawMetrics[k] != 0
    );
    if (allPresent) {
      const val = rule.formula(rawMetrics);
      if (val !== null && !isNaN(val) && isFinite(val) && val > 0) {
        result[rule.key] = parseFloat(val.toFixed(4));
      }
    } else {
      if (!mf[rule.key]) delete result[rule.key];
    }
  }
  return result;
}

function getAutoCalcFields(rawMetrics, campaignId) {
  const mf = manualFields[campaignId || activeTab] || {};
  const autoSet = new Set();
  for (const rule of AUTO_CALC_RULES) {
    if (mf[rule.key]) continue;
    const allPresent = rule.requires.every(k =>
      rawMetrics[k] !== undefined && rawMetrics[k] !== '' &&
      !isNaN(rawMetrics[k]) && rawMetrics[k] != 0
    );
    if (allPresent) autoSet.add(rule.key);
  }
  return autoSet;
}

function handleQueryParams() {
  const params = new URLSearchParams(window.location.search);
  const sampleName = params.get('sample');
  if (sampleName && SAMPLE_DATASETS[sampleName]) {
    loadSampleData(sampleName);
    return true;
  }
  return false;
}

function loadSampleData(name) {
  const ds = SAMPLE_DATASETS[name];
  if (!ds) return;
  campaigns = ds.campaigns.map(c => normalizeCampaign(c));
  activeTab = campaigns[0].id;
  campaignCounter = campaigns.length;
  localStorage.removeItem('funnelPulseData');
  render();
}

function exportShareLink() {
  const state = JSON.stringify({ campaigns, activeTab, campaignCounter });
  const encoded = btoa(unescape(encodeURIComponent(state)));
  const url = window.location.origin + window.location.pathname + '#share=' + encoded;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnShare');
    if (btn) { const orig = btn.innerHTML; btn.innerHTML = '✓ Link Copied!'; setTimeout(() => btn.innerHTML = orig, 2000); }
  }).catch(() => { prompt('Copy this link:', url); });
}

function toggleSampleMenu() {
  const m = document.getElementById('sampleMenu');
  if (m) m.style.display = m.style.display === 'none' ? 'block' : 'none';
}

function hideSampleMenu() {
  const m = document.getElementById('sampleMenu');
  if (m) m.style.display = 'none';
}

function handleShareHash() {
  const hash = window.location.hash;
  if (hash.startsWith('#share=')) {
    try {
      const encoded = hash.substring(7);
      const state = JSON.parse(decodeURIComponent(escape(atob(encoded))));
      campaigns = state.campaigns.map(normalizeCampaign);
      activeTab = state.activeTab || campaigns[0].id;
      campaignCounter = state.campaignCounter || campaigns.length;
      return true;
    } catch(e) { return false; }
  }
  return false;
}

function getFormulaHint(key) {
  const rule = AUTO_CALC_RULES.find(r => r.key === key);
  return rule ? rule.hint : null;
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function has(m, ...keys) {
  return keys.every(k => m[k] !== undefined && m[k] !== null && m[k] !== '' && !isNaN(m[k]) && m[k] !== 0);
}

function fmt(val, type) {
  if (val === undefined || val === null || val === '') return '—';
  const n = parseFloat(val);
  if (isNaN(n)) return '—';
  switch(type) {
    case 'currency': return n >= 1000 ? '₹' + (n/1000).toFixed(1) + 'k' : '₹' + n.toLocaleString('en-IN', {maximumFractionDigits: 2});
    case 'percent': return n.toFixed(2) + '%';
    case 'number': return n >= 1000000 ? (n/1000000).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : n.toLocaleString('en-IN');
    case 'roas': return n.toFixed(2) + 'x';
    default: return n.toLocaleString('en-IN', {maximumFractionDigits: 2});
  }
}

function fmtDisplay(val, def) {
  if (!def || val === '' || val === undefined || val === null) return null;
  return fmt(parseFloat(val), def[6]);
}

function getActiveCampaign() {
  return campaigns.find(c => c.id === activeTab) || campaigns[0];
}

function getActivePeriod(campaign) {
  const c = campaign || getActiveCampaign();
  normalizeCampaign(c);
  return c.periods[c.activePeriodIndex || 0];
}

function getPriorPeriod(campaign) {
  const c = campaign || getActiveCampaign();
  const idx = c.activePeriodIndex || 0;
  return idx < c.periods.length - 1 ? c.periods[idx + 1] : null;
}

function calculateTrend(currentVal, priorVal) {
  if (!priorVal || priorVal === 0) return null;
  const change = ((currentVal - priorVal) / priorVal) * 100;
  return {
    direction: change > 0 ? 'up' : change < 0 ? 'down' : 'flat',
    percent: Math.abs(change).toFixed(1),
    change
  };
}

function formatDateRange(period) {
  if (!period) return 'Select Period';
  const start = new Date(period.startDate);
  const end = new Date(period.endDate);
  if (period.startDate === period.endDate) {
    return start.toLocaleDateString('en-IN', {month:'short', day:'numeric', year:'numeric'});
  }
  return `${start.toLocaleDateString('en-IN', {month:'short', day:'numeric'})} - ${end.toLocaleDateString('en-IN', {month:'short', day:'numeric', year:'numeric'})}`;
}

function runDiagnostics(metrics) {
  const triggered = [];
  for (const rule of RULES) {
    try {
      if (rule.condition(metrics)) {
        triggered.push({
          ...rule,
          explanationText: typeof rule.explanation === 'function' ? rule.explanation(metrics) : rule.explanation
        });
      }
    } catch(e) {}
  }
  const order = { critical: 0, warning: 1, healthy: 2, info: 3 };
  triggered.sort((a,b) => (order[a.severity]||9) - (order[b.severity]||9));
  return triggered;
}

function getStageHealth(metrics, stageKey, diagnoses) {
  const stageDiagnoses = diagnoses.filter(d => d.stages.includes(stageKey));
  if (stageDiagnoses.some(d => d.severity === 'critical')) return 'critical';
  if (stageDiagnoses.some(d => d.severity === 'warning')) return 'watch';
  if (stageDiagnoses.some(d => d.severity === 'healthy')) return 'healthy';

  const stage = STAGES.find(s => s.key === stageKey);
  const hasAny = stage.metrics.some(mk => metrics[mk] !== undefined && metrics[mk] !== '');
  if (!hasAny) return 'neutral';
  return 'healthy';
}

function overallHealthScore(diagnoses, metrics) {
  const hasMetrics = METRIC_DEFS.some(d => metrics[d[0]] !== undefined && metrics[d[0]] !== '');
  if (!hasMetrics) return null;

  const criticals = diagnoses.filter(d => d.severity === 'critical').length;
  const warnings = diagnoses.filter(d => d.severity === 'warning').length;
  const healthies = diagnoses.filter(d => d.severity === 'healthy').length;

  let score = 100;
  score -= criticals * 20;
  score -= warnings * 8;
  score += healthies * 5;
  return Math.max(0, Math.min(100, score));
}

function healthColor(h) {
  return h === 'healthy' ? 'var(--healthy)' : h === 'critical' ? 'var(--critical)' : h === 'watch' ? 'var(--watch)' : 'var(--neutral)';
}

function healthLabel(h) {
  return h === 'healthy' ? 'Healthy' : h === 'critical' ? 'Critical' : h === 'watch' ? 'Watch' : 'No data';
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── RENDER CONTROLLER ──────────────────────────────────────────────────────
function render() {
  renderTabs();
  if (activeTab === 'compare') {
    renderCompareView();
  } else {
    renderMain();
  }
}

function renderTabs() {
  const tabs = document.getElementById('campaignTabs');
  const addBtn = document.getElementById('btnAddCampaign');

  if (addBtn) {
    if (campaigns.length >= MAX_CAMPAIGNS) {
      addBtn.disabled = true;
      addBtn.title = 'Maximum 3 campaigns allowed';
      addBtn.innerHTML = `<span>+</span> Max 3 reached`;
    } else {
      addBtn.disabled = false;
      addBtn.title = 'Add new campaign';
      addBtn.innerHTML = `<span>+</span> New Campaign`;
    }
  }

  let html = campaigns.map(c => `
    <div class="tab-item-wrap ${c.id === activeTab ? 'active' : ''}">
      <button class="tab-btn" onclick="switchCampaign(${c.id})">
        <span class="campaign-name" data-id="${c.id}" contenteditable="true" onblur="updateCampaignName(${c.id}, this.innerText)" onclick="event.stopPropagation()">${escHtml(c.name)}</span>
      </button>
      ${campaigns.length > 1 ? `
        <button class="tab-delete-btn" title="Delete campaign" onclick="deleteCampaign(${c.id}, event)">×</button>
      ` : ''}
    </div>
  `).join('');

  if (campaigns.length >= 2) {
    html += `
      <button class="compare-tab-btn ${activeTab === 'compare' ? 'active' : ''}" onclick="switchCampaign('compare')">
        ⚖️ Compare (${campaigns.length}/3)
      </button>
    `;
  }

  tabs.innerHTML = html;
}

function updateCampaignName(id, newName) {
  const c = campaigns.find(c => c.id === id);
  if (c && newName.trim()) {
    c.name = newName.trim();
    render();
  }
}

// ── SINGLE CAMPAIGN VIEW ───────────────────────────────────────────────────
function renderMain() {
  const campaign = getActiveCampaign();
  const activePeriod = getActivePeriod(campaign);
  if (!activePeriod) return; // Defensive check
  const raw = activePeriod.metrics;
  const m = getEffectiveMetrics(raw, campaign.id);
  const autoFields = getAutoCalcFields(raw, campaign.id);
  const diagnoses = runDiagnostics(m);
  const stageHealths = {};
  STAGES.forEach(s => stageHealths[s.key] = getStageHealth(m, s.key, diagnoses));
  const score = overallHealthScore(diagnoses, m);
  const topIssue = diagnoses[0] || null;

  const scoreColor = score === null ? 'var(--neutral)' : score >= 70 ? 'var(--healthy)' : score >= 45 ? 'var(--watch)' : 'var(--critical)';

  document.getElementById('mainContent').innerHTML = `
    <!-- Hero -->
    <div class="campaign-hero">
      <div class="campaign-title-wrap">
        <div class="campaign-title">${escHtml(campaign.name)}</div>
        <div class="campaign-meta">${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        ${score !== null ? `
        <div class="health-score-badge">
          <span class="health-score-label">Health Score</span>
          <span class="health-score-value" style="color:${scoreColor}">${score}</span>
        </div>` : ''}
        <button class="btn-export" onclick="exportPDF()">📥 Export Report</button>
        <button class="btn-export" onclick="exportShareLink()" id="btnShare" style="background:rgba(255,255,255,0.08);">🔗 Share Link</button>
        <button class="btn-export" onclick="toggleSampleMenu()" id="btnSample" style="background:rgba(255,255,255,0.08);" title="Load a pre-filled marketing scenario">📋 Load Sample ▾</button>
      </div>
      <div id="sampleMenu" style="display:none; margin-top:10px;">
        <div style="font-size:12px;color:var(--text-tertiary);margin-bottom:6px;">Load Sample Data (clears current input):</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;">
          ${Object.keys(SAMPLE_DATASETS).map(k => `
            <button class="period-nav-btn" onclick="loadSampleData('${k}'); hideSampleMenu();" style="font-size:12px;padding:5px 10px;border-radius:6px;background:var(--surface-2);color:var(--text-primary);cursor:pointer;">${SAMPLE_DATASETS[k].label}</button>
          `).join('')}
        </div>
        <div style="font-size:11px;color:var(--text-tertiary);margin-top:6px;">Each sample pre-fills 1–2 campaigns with realistic marketing data and triggers auto-calculations + diagnoses.</div>
      </div>
    </div>

    <!-- Custom Date Range -->
    <div class="period-selector" style="margin-top: 8px; padding: 12px 16px;">
      <span class="period-label">Custom Range</span>
      <input type="date" class="period-dropdown" value="${activePeriod.startDate}" onchange="updatePeriodDate('startDate', this.value)" style="padding: 6px 10px;">
      <span style="color: var(--text-tertiary);">to</span>
      <input type="date" class="period-dropdown" value="${activePeriod.endDate}" onchange="updatePeriodDate('endDate', this.value)" style="padding: 6px 10px;">
    </div>

    <!-- Funnel Bar -->
    <div class="funnel-bar">
      ${STAGES.map((s, i) => `
        <div class="funnel-stage-pill ${stageHealths[s.key]}"
             onclick="document.getElementById('stage-${s.key}')?.scrollIntoView({behavior:'smooth'})">
          <div class="stage-dot" style="background: ${healthColor(stageHealths[s.key])}"></div>
          <div class="stage-info">
            <span class="stage-name">${s.label}</span>
            <span class="stage-status" style="color:${healthColor(stageHealths[s.key])}">${healthLabel(stageHealths[s.key])}</span>
          </div>
        </div>
        ${i < STAGES.length-1 ? '<div class="funnel-arrow">›</div>' : ''}
      `).join('')}
    </div>

    <!-- Input Section (Top) -->
    ${renderInputSection(raw, autoFields, m)}

    <!-- Metrics Grid per stage (Middle) -->
    <div style="margin-bottom: 40px;">
      ${STAGES.map(s => renderStageGrid(s, m, stageHealths[s.key])).join('')}
    </div>

    <!-- Findings & Diagnosis Panel (Bottom) -->
    <div class="findings-title">
      <span>🔍</span> Funnel Findings & Diagnostics
    </div>
    ${renderDiagnosisPanel(topIssue, diagnoses, score, m)}
  `;

  // re-attach toggle events
  const allToggle = document.getElementById('allIssuesToggle');
  if (allToggle) {
    allToggle.onclick = () => {
      allIssuesVisible = !allIssuesVisible;
      const list = document.getElementById('allIssuesList');
      if (list) list.classList.toggle('visible', allIssuesVisible);
      allToggle.innerHTML = allIssuesVisible
        ? `<span>▲</span> Hide all issues`
        : `<span>▼</span> See all ${diagnoses.filter(d=>d.severity!=='healthy').length} issues`;
    };
  }

  const collapseBtn = document.getElementById('collapseBtn');
  if (collapseBtn) {
    collapseBtn.onclick = toggleInputCollapse;
    if (inputCollapsed) {
      const body = document.getElementById('inputBody');
      if (body) body.style.display = 'none';
      collapseBtn.classList.add('collapsed');
    }
  }
}

function renderDiagnosisPanel(topIssue, diagnoses, score, m) {
  const hasMetrics = METRIC_DEFS.some(d => m[d[0]] !== undefined && m[d[0]] !== '');

  if (!hasMetrics) {
    return `<div class="diagnosis-panel">
      <div class="diagnosis-empty">
        <span class="diagnosis-empty-icon">↑</span>
        <span>Enter your campaign metrics above to see your funnel diagnosis</span>
      </div>
    </div>`;
  }

  if (!topIssue || topIssue.severity === 'healthy') {
    const healthies = diagnoses.filter(d => d.severity === 'healthy');
    return `<div class="diagnosis-panel all-healthy fade-in">
      <div class="diagnosis-header">
        <div class="diagnosis-icon healthy">✓</div>
        <div class="diagnosis-main">
          <div class="diagnosis-severity healthy">All Clear</div>
          <div class="diagnosis-title">${healthies.length > 0 ? healthies[0].title : 'Funnel looks healthy'}</div>
          <div class="diagnosis-explanation">${healthies.length > 0 ? healthies[0].explanationText : 'No critical issues detected across your funnel stages.'}</div>
          ${healthies.length > 0 ? `<div class="diagnosis-action">💡 ${healthies[0].action}</div>` : ''}
        </div>
      </div>
    </div>`;
  }

  const nonHealthy = diagnoses.filter(d => d.severity !== 'healthy');
  const icon = topIssue.severity === 'critical' ? '⚠' : '◉';
  const panelClass = topIssue.severity === 'critical' ? 'has-critical' : 'has-watch';

  return `<div class="diagnosis-panel ${panelClass} fade-in">
    <div class="diagnosis-header">
      <div class="diagnosis-icon ${topIssue.severity}">${icon}</div>
      <div class="diagnosis-main">
        <div class="diagnosis-severity ${topIssue.severity}">${topIssue.severity.toUpperCase()} ISSUE</div>
        <div class="diagnosis-title">${escHtml(topIssue.title)}</div>
        <div class="diagnosis-explanation">${escHtml(topIssue.explanationText)}</div>
        <div class="diagnosis-action">→ ${escHtml(topIssue.action)}</div>
      </div>
    </div>
    <div class="diagnosis-metrics-triggered">
      ${topIssue.chips.map(c => `<span class="metric-chip">${c}</span>`).join('')}
    </div>
    ${nonHealthy.length > 1 ? `
      <button class="all-issues-toggle" id="allIssuesToggle">
        <span>▼</span> See all ${nonHealthy.length} issues
      </button>
      <div class="all-issues-list ${allIssuesVisible ? 'visible' : ''}" id="allIssuesList">
        ${nonHealthy.slice(1).map(issue => `
          <div class="issue-row">
            <div class="issue-dot" style="background:${healthColor(issue.severity === 'warning' ? 'watch' : issue.severity)}"></div>
            <div class="issue-content">
              <div class="issue-title">${escHtml(issue.title)}</div>
              <div class="issue-detail">${escHtml(issue.explanationText)}</div>
              <div class="issue-action">→ ${escHtml(issue.action)}</div>
            </div>
          </div>
        `).join('')}
      </div>
    ` : ''}
  </div>`;
}

function renderStageGrid(stage, m, stageHealth) {
  const defs = METRIC_DEFS.filter(d => d[2] === stage.key);
  return `
    <div id="stage-${stage.key}">
      <div class="section-label" style="color:${healthColor(stageHealth)}">${stage.label}</div>
      <div class="metrics-grid">
        ${defs.map(def => renderMetricTile(def, m[def[0]], stageHealth)).join('')}
      </div>
    </div>
  `;
}

function renderMetricTile(def, val, stageHealth) {
  const [key, label, stage, unit, benchLow, benchHigh, format, desc] = def;
  const hasVal = val !== undefined && val !== '' && val !== null && !isNaN(val);
  const displayVal = hasVal ? fmtDisplay(val, def) : null;

  let tileClass = '';
  if (hasVal) {
    const n = parseFloat(val);
    if (key === 'ctr') tileClass = n > 3 ? 'healthy' : n > 1.5 ? '' : n < 0.8 ? 'critical' : 'watch';
    else if (key === 'cvr') tileClass = n > 2 ? 'healthy' : n > 1 ? '' : 'critical';
    else if (key === 'roas') tileClass = n > 4 ? 'healthy' : n > 2 ? '' : n < 1.5 ? 'critical' : 'watch';
    else if (key === 'cpm') tileClass = n < 5 ? 'healthy' : n < 15 ? '' : 'watch';
    else if (key === 'cpc') tileClass = n < 1 ? 'healthy' : n < 3 ? '' : 'watch';
    else if (key === 'cpa') tileClass = n < 50 ? 'healthy' : n < 200 ? '' : 'critical';
    else if (key === 'cpl') tileClass = n < 20 ? 'healthy' : n < 80 ? '' : 'watch';
    else if (key === 'cac') tileClass = n < 50 ? 'healthy' : n < 200 ? '' : 'watch';
    else tileClass = stageHealth === 'healthy' ? 'healthy' : '';
  }

  const dotColor = tileClass === 'healthy' ? 'var(--healthy)' : tileClass === 'critical' ? 'var(--critical)' : tileClass === 'watch' ? 'var(--watch)' : 'var(--neutral)';

  return `
    <div class="metric-tile ${tileClass}">
      <div class="metric-tile-header">
        <div class="metric-name">${label}</div>
        ${hasVal ? `<div class="metric-status-dot" style="background:${dotColor}"></div>` : '<div class="metric-status-dot"></div>'}
      </div>
      <div class="metric-value ${!hasVal ? 'empty' : ''}">${displayVal || '—'}</div>
      <div class="metric-subtitle">${desc}</div>
    </div>
  `;
}

function renderInputSection(raw, autoFields, effective) {
  autoFields = autoFields || new Set();
  effective = effective || raw;
  const byStage = {};
  STAGES.forEach(s => byStage[s.key] = []);
  METRIC_DEFS.forEach(d => byStage[d[2]].push(d));

  return `
    <div class="input-section">
      <div class="input-section-header">
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;" onclick="toggleInputCollapse()">
          <div class="input-section-title" style="cursor: pointer;">Enter Metrics</div>
          ${campaigns.length > 1 ? `
            <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary);" onclick="event.stopPropagation()">
              <span>Editing:</span>
              <select class="period-dropdown" onchange="switchCampaign(parseInt(this.value))" style="font-size: 13px; padding: 4px 10px; font-weight: 600; color: var(--text-primary); background: rgba(255,255,255,0.1); border-radius: 8px;">
                ${campaigns.map(c => `<option value="${c.id}" ${c.id === activeTab ? 'selected' : ''}>${escHtml(c.name)}</option>`).join('')}
              </select>
            </div>
          ` : ''}
        </div>
        <button class="collapse-btn ${inputCollapsed ? 'collapsed' : ''}" id="collapseBtn">▼</button>
      </div>
      <div class="input-body" id="inputBody">
        <div class="input-mode-tabs">
          <button class="mode-tab ${inputMode === 'manual' ? 'active' : ''}" onclick="switchInputMode('manual')">Manual Input</button>
          <button class="mode-tab ${inputMode === 'csv' ? 'active' : ''}" onclick="switchInputMode('csv')">CSV Import</button>
        </div>

        ${inputMode === 'manual' ? `
          ${STAGES.map(stage => `
            <div class="form-stage">
              <span class="form-stage-label">${stage.label}</span>
              <div class="form-row">
                ${byStage[stage.key].map(def => {
                  const isAuto = autoFields.has(def[0]);
                  const hint = getFormulaHint(def[0]);
                  const dispVal = isAuto
                    ? (effective[def[0]] !== undefined ? parseFloat(effective[def[0]].toFixed(4)) : '')
                    : (raw[def[0]] !== undefined ? raw[def[0]] : '');
                  return `
                  <div class="form-field">
                    <div class="form-label-row">
                      <label class="form-label" for="input-${def[0]}">${def[1]}</label>
                      ${hint ? `<span class="formula-hint">${hint}</span>` : ''}
                    </div>
                    <input class="form-input${isAuto ? ' auto-calc' : ''}" id="input-${def[0]}" type="number"
                      step="any" min="0"
                      placeholder="${def[1]}"
                      value="${dispVal}"
                      data-auto-calc="${isAuto ? 'true' : ''}"
                      oninput="updateMetric('${def[0]}', this.value)"
                      onfocus="onMetricFocus('${def[0]}')" />
                    ${isAuto ? `<span class="auto-badge">auto</span>` : ''}
                  </div>`;
                }).join('')}
              </div>
            </div>
          `).join('')}
        ` : `
          <div>
            <div class="csv-toolbar">
              <div class="csv-btn-group">
                <button class="btn-csv-action" onclick="downloadCSVTemplate()">
                  <span>📥</span> Download CSV Template
                </button>
                <label class="btn-csv-action" style="cursor: pointer;">
                  <span>📂</span> Upload CSV File
                  <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none;" onchange="handleCSVFileUpload(this)">
                </label>
              </div>
              <span style="font-size: 11px; color: var(--text-tertiary);">Supports up to 3 campaigns in a single CSV</span>
            </div>

            <textarea class="csv-area" id="csvInput" placeholder="campaign,startDate,endDate,impressions,clicks,cost,revenue,sales,ctr,cpc,cpm,rpm,cvr,cpl,cpa,l2a,r2a,roas,rpc,aov,cac,ltv
Meta Ads,2026-09-24,2026-09-30,150000,3800,4500,18000,60,,,,,,,,,,,,,,
Google Search,2026-09-24,2026-09-30,85000,4200,6000,31000,110,,,,,,,,,,,,,,"></textarea>

            <div class="csv-hint">
              <strong>CSV Format:</strong> Header row + up to 3 rows of campaign metrics.<br>
              Columns: <code>campaign</code> (name), <code>startDate</code>, <code>endDate</code> (YYYY-MM-DD format), then metric columns. Blank cells are auto-calculated automatically.
            </div>

            ${csvValidationStatus ? `
              <div class="validation-banner ${csvValidationStatus.type}">
                <span>${csvValidationStatus.type === 'success' ? '✓' : csvValidationStatus.type === 'error' ? '⚠️' : 'ℹ️'}</span>
                <div>${csvValidationStatus.message}</div>
              </div>
            ` : ''}

            <button class="btn-analyze" onclick="parseAndValidateCSV()">→ Parse & Load Campaigns</button>
            <button class="btn-clear" onclick="clearCSVData()">Clear CSV</button>
          </div>

  `;
}

// ── COMPARE VIEW ───────────────────────────────────────────────────────────
function renderCompareView() {
  const compData = campaigns.map(c => {
    normalizeCampaign(c);
    const activePeriod = getActivePeriod(c);
    const raw = activePeriod ? activePeriod.metrics : {};
    const eff = getEffectiveMetrics(raw, c.id);
    const diag = runDiagnostics(eff);
    const score = overallHealthScore(diag, eff);
    const topIssue = diag[0] || null;
    const stageHealths = {};
    STAGES.forEach(s => stageHealths[s.key] = getStageHealth(eff, s.key, diag));
    return {
      campaign: c,
      raw,
      effective: eff,
      diagnoses: diag,
      score,
      topIssue,
      stageHealths
    };
  });

  const numCols = Math.min(campaigns.length, 3);

  document.getElementById('mainContent').innerHTML = `
    <div class="compare-hero">
      <div class="campaign-title-wrap">
        <div class="campaign-title">⚖️ Campaign Comparison</div>
        <div class="campaign-meta">Analyzing ${campaigns.length} campaigns side-by-side (Max 3)</div>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <button class="modal-btn" onclick="switchCampaign(${campaigns[0].id})">← Back to Single View</button>
        <button class="modal-btn" onclick="clearAllCampaigns()" style="border-color: rgba(255,69,58,0.4); color: #FF453A;">✕ Clear All Data</button>
        <button class="btn-export" onclick="exportPDF()" style="margin-left: 16px;">📥 Export Comparison Report</button>
      </div>
    </div>

    <!-- Summary Cards Grid -->
    <div class="compare-cards-grid cols-${numCols}">
      ${compData.map(cd => {
        const sc = cd.score;
        const scoreColor = sc === null ? 'var(--neutral)' : sc >= 70 ? 'var(--healthy)' : sc >= 45 ? 'var(--watch)' : 'var(--critical)';
        return `
          <div class="compare-card">
            <div class="compare-card-header">
              <div class="compare-card-title">${escHtml(cd.campaign.name)}</div>
              <div class="compare-score-badge" style="color:${scoreColor}">
                ${sc !== null ? `${sc}<span style="font-size:11px;color:var(--text-tertiary);">/100</span>` : '—'}
              </div>
            </div>

            <!-- Mini Funnel Health -->
            <div class="compare-funnel-mini" title="Funnel health across 5 stages">
              ${STAGES.map(s => `
                <div class="compare-funnel-dot" style="background:${healthColor(cd.stageHealths[s.key])};" title="${s.label}: ${healthLabel(cd.stageHealths[s.key])}"></div>
              `).join('')}
            </div>

            <!-- Top finding preview -->
            <div class="compare-card-finding">
              ${cd.topIssue ? `<strong>${cd.topIssue.severity.toUpperCase()}:</strong> ${escHtml(cd.topIssue.title)}` : 'No major issues detected'}
            </div>

            <div style="margin-top: 16px; display: flex; gap: 8px; justify-content: space-between; font-size: 12px; color: var(--text-secondary);">
              <div>Spend: <strong>${fmt(cd.effective.cost, 'currency')}</strong></div>
              <div>Rev: <strong>${fmt(cd.effective.revenue, 'currency')}</strong></div>
              <div>ROAS: <strong style="color:var(--accent);">${fmt(cd.effective.roas, 'roas')}</strong></div>
            </div>

            <button class="modal-btn" style="width: 100%; margin-top: 14px; font-size: 12px; padding: 6px;" onclick="switchCampaign(${cd.campaign.id})">✏️ Edit Campaign Data</button>
          </div>
        `;
      }).join('')}
    </div>

    <!-- Comparison Table -->
    <div class="compare-table-wrap">
      <table class="compare-table">
        <thead>
          <tr>
            <th style="width: 30%;">Metric</th>
            ${compData.map(cd => `<th>${escHtml(cd.campaign.name)}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${STAGES.map(stage => {
            const defs = METRIC_DEFS.filter(d => d[2] === stage.key);
            return `
              <tr class="stage-header-row">
                <td colspan="${compData.length + 1}">${stage.label} Stage</td>
              </tr>
              ${defs.map(def => {
                const [key, label, stg, unit, bLow, bHigh, format, desc, higherIsBetter] = def;

                // Find winning campaign for this metric
                let bestIdx = -1;
                let bestVal = null;
                const vals = compData.map(cd => cd.effective[key]);
                const validVals = vals.filter(v => v !== undefined && v !== null && !isNaN(v));

                if (validVals.length > 1) {
                  vals.forEach((v, idx) => {
                    if (v !== undefined && v !== null && !isNaN(v)) {
                      if (bestVal === null) {
                        bestVal = v;
                        bestIdx = idx;
                      } else {
                        if (higherIsBetter && v > bestVal) {
                          bestVal = v;
                          bestIdx = idx;
                        } else if (!higherIsBetter && v < bestVal) {
                          bestVal = v;
                          bestIdx = idx;
                        }
                      }
                    }
                  });
                }

                return `
                  <tr>
                    <td>
                      <div class="compare-metric-name">${label}</div>
                      <div class="compare-metric-desc">${desc}</div>
                    </td>
                    ${compData.map((cd, idx) => {
                      const v = cd.effective[key];
                      const isWinner = (idx === bestIdx && validVals.length > 1);
                      return `
                        <td class="val-cell ${isWinner ? 'winner' : ''}">
                          ${v !== undefined && v !== null ? fmtDisplay(v, def) : '<span style="color:var(--text-tertiary);">—</span>'}
                        </td>
                      `;
                    }).join('')}
                  </tr>
                `;
              }).join('')}
            `;
          }).join('')}
        </tbody>
      </table>
    </div>

    <!-- Findings Comparison Side-by-Side -->
    <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Side-by-Side Funnel Findings</h3>
    <div class="compare-cards-grid cols-${numCols}">
      ${compData.map(cd => `
        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 16px; padding: 20px;">
          <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--text-primary);">${escHtml(cd.campaign.name)}</h4>
          ${cd.diagnoses.length === 0 ? `
            <div style="font-size: 13px; color: var(--text-tertiary);">No metrics entered</div>
          ` : cd.diagnoses.slice(0, 3).map(diag => `
            <div style="margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
              <div style="font-size: 11px; font-weight: 700; color:${healthColor(diag.severity==='warning'?'watch':diag.severity)}; text-transform:uppercase;">
                ${diag.severity}
              </div>
              <div style="font-size: 13px; font-weight: 600; margin: 2px 0;">${escHtml(diag.title)}</div>
              <div style="font-size: 12px; color: var(--text-secondary); line-height: 1.4;">${escHtml(diag.action)}</div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `;
}

// ── ACTIONS ────────────────────────────────────────────────────────────────
function updateMetric(key, value) {
  const c = getActiveCampaign();
  const period = getActivePeriod(c);
  const mf = getManualFields(c.id);

  if (value === '' || value === null) {
    delete period.metrics[key];
    delete mf[key];
  } else {
    const n = parseFloat(value);
    if (!isNaN(n)) {
      period.metrics[key] = n;
      mf[key] = true;
    }
  }
  saveToLocalStorage();
  rerenderVisuals();
  updateAutoCalcInputs();
}

function updateAutoCalcInputs() {
  const c = getActiveCampaign();
  const period = getActivePeriod(c);
  const effective = getEffectiveMetrics(period.metrics, c.id);
  const autoFields = getAutoCalcFields(period.metrics, c.id);

  for (const rule of AUTO_CALC_RULES) {
    const input = document.getElementById(`input-${rule.key}`);
    if (!input) continue;
    const isAuto = autoFields.has(rule.key);
    if (isAuto) {
      const val = effective[rule.key];
      if (val !== undefined) {
        if (input.dataset.autoCalc === 'true' || input.value === '') {
          input.value = parseFloat(val.toFixed(4));
          input.dataset.autoCalc = 'true';
          input.classList.add('auto-calc');
          const badge = input.parentElement.querySelector('.auto-badge');
          if (badge) badge.style.display = '';
        }
      }
    } else {
      if (input.dataset.autoCalc === 'true') {
        input.dataset.autoCalc = '';
        input.classList.remove('auto-calc');
        const badge = input.parentElement.querySelector('.auto-badge');
        if (badge) badge.style.display = 'none';
      }
    }
  }
}

function rerenderVisuals() {
  if (activeTab === 'compare') {
    renderCompareView();
    return;
  }

  const campaign = getActiveCampaign();
  const activePeriod = getActivePeriod(campaign);
  const raw = activePeriod.metrics;
  const m = getEffectiveMetrics(raw, campaign.id);
  const diagnoses = runDiagnostics(m);
  const stageHealths = {};
  STAGES.forEach(s => stageHealths[s.key] = getStageHealth(m, s.key, diagnoses));
  const score = overallHealthScore(diagnoses, m);
  const topIssue = diagnoses[0] || null;
  const scoreColor = score === null ? 'var(--neutral)' : score >= 70 ? 'var(--healthy)' : score >= 45 ? 'var(--watch)' : 'var(--critical)';

  // Update health score
  const scoreEl = document.querySelector('.health-score-value');
  if (scoreEl && score !== null) {
    scoreEl.textContent = score;
    scoreEl.style.color = scoreColor;
  }

  // Update funnel pills
  document.querySelectorAll('.funnel-stage-pill').forEach((pill, i) => {
    const stage = STAGES[i];
    if (!stage) return;
    const h = stageHealths[stage.key];
    pill.className = `funnel-stage-pill ${h}`;
    const dot = pill.querySelector('.stage-dot');
    const status = pill.querySelector('.stage-status');
    if (dot) dot.style.background = healthColor(h);
    if (status) { status.textContent = healthLabel(h); status.style.color = healthColor(h); }
  });

  // Update diagnosis panel
  const dp = document.querySelector('.diagnosis-panel');
  if (dp) {
    const newPanel = document.createElement('div');
    newPanel.innerHTML = renderDiagnosisPanel(topIssue, diagnoses, score, m);
    const newPanelEl = newPanel.firstElementChild;
    dp.replaceWith(newPanelEl);

    const allToggle = document.getElementById('allIssuesToggle');
    if (allToggle) {
      allToggle.onclick = () => {
        allIssuesVisible = !allIssuesVisible;
        const list = document.getElementById('allIssuesList');
        if (list) list.classList.toggle('visible', allIssuesVisible);
        const nonHealthy = diagnoses.filter(d => d.severity !== 'healthy');
        allToggle.innerHTML = allIssuesVisible
          ? `<span>▲</span> Hide all issues`
          : `<span>▼</span> See all ${nonHealthy.length} issues`;
      };
    }
  }

  // Update metric tiles
  STAGES.forEach(stage => {
    const defs = METRIC_DEFS.filter(d => d[2] === stage.key);
    const grid = document.querySelector(`#stage-${stage.key} .metrics-grid`);
    if (grid) {
      grid.innerHTML = defs.map(def => renderMetricTile(def, m[def[0]], stageHealths[stage.key])).join('');
    }
    const label = document.querySelector(`#stage-${stage.key} .section-label`);
    if (label) label.style.color = healthColor(stageHealths[stage.key]);
  });
}

function onMetricFocus(key) {
  const input = document.getElementById(`input-${key}`);
  if (!input) return;
  if (input.dataset.autoCalc === 'true') {
    input.value = '';
    input.dataset.autoCalc = '';
    input.classList.remove('auto-calc');
    const badge = input.parentElement.querySelector('.auto-badge');
    if (badge) badge.style.display = 'none';
    const c = getActiveCampaign();
    const mf = getManualFields(c.id);
    const period = getActivePeriod(c);
    if (period) delete period.metrics[key];
    delete mf[key];
  }
}

function addNewPeriod() {
  const c = getActiveCampaign();
  if (c.periods.length >= MAX_PERIODS) {
    alert(`Maximum ${MAX_PERIODS} periods allowed per campaign.`);
    return;
  }
  // Default to last 7 days from today
  const endDate = new Date();
  const startDate = new Date();
  startDate.setDate(startDate.getDate() - 7);

  c.periods.unshift({
    startDate: startDate.toISOString().split('T')[0],
    endDate: endDate.toISOString().split('T')[0],
    metrics: {}
  });
  c.activePeriodIndex = 0;
  saveToLocalStorage();
  render();
}

// ── CSV PARSER, VALIDATOR & TEMPLATE GENERATOR ────────────────────────────
function downloadCSVTemplate() {
  const headers = ['campaign','startDate','endDate',...METRIC_DEFS.map(d => d[0])].join(',');
  const sample1 = 'Meta Top of Funnel,2026-09-24,2026-09-30,150000,3800,,4500,18000,60,,,,,,,,,,,,,,';
  const sample2 = 'Google Search Ads,2026-09-24,2026-09-30,85000,4200,,6000,31000,110,,,,,,,,,,,,,,';
  const sample3 = 'Retargeting Campaign,2026-09-24,2026-09-30,40000,2100,,2200,15000,55,,,,,,,,,,,,,,';
  const content = `${headers}\n${sample1}\n${sample2}\n${sample3}\n`;

  const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', 'funnel_metrics_template.csv');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function handleCSVFileUpload(input) {
  if (!input.files || input.files.length === 0) return;
  const file = input.files[0];
  const reader = new FileReader();
  reader.onload = function(e) {
    const text = e.target.result;
    document.getElementById('csvInput').value = text;
    parseAndValidateCSV();
  };
  reader.readAsText(file);
}

function parseAndValidateCSV() {
  const textarea = document.getElementById('csvInput');
  if (!textarea) return;
  const raw = textarea.value.trim();

  if (!raw) {
    csvValidationStatus = { type: 'error', message: 'Please enter or upload CSV data.' };
    render();
    return;
  }

  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l);
  if (lines.length < 2) {
    csvValidationStatus = { type: 'error', message: 'CSV must have at least 1 header row and 1 data row.' };
    render();
    return;
  }

  // Parse Header
  const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
  const validKeys = new Set(METRIC_DEFS.map(d => d[0]));
  const headerMap = []; // index -> metric key or 'campaign' or 'startDate' or 'endDate'
  let hasCampaignCol = false;
  const dateCols = new Set(['startdate','startdate','enddate','enddate']);
  const unrecognized = [];

  rawHeaders.forEach((h, idx) => {
    const clean = h.replace(/[^a-z0-9]/g, '');
    if (clean === 'campaign' || clean === 'name' || clean === 'campaignname') {
      headerMap[idx] = 'campaign';
      hasCampaignCol = true;
    } else if (clean === 'startdate') {
      headerMap[idx] = 'startDate';
    } else if (clean === 'enddate') {
      headerMap[idx] = 'endDate';
    } else if (validKeys.has(clean)) {
      headerMap[idx] = clean;
    } else if (clean) {
      unrecognized.push(h);
      headerMap[idx] = null;
    }
  });

  const recognizedMetricCount = headerMap.filter(k => k && k !== 'campaign' && k !== 'startDate' && k !== 'endDate').length;
  if (recognizedMetricCount === 0) {
    csvValidationStatus = { type: 'error', message: 'No recognized metric column headers found. Please use the CSV template.' };
    render();
    return;
  }

  // Parse Rows (up to MAX_PERIODS across all campaigns)
  const dataRows = lines.slice(1);
  const parsedCampaigns = [];
  const errors = [];

  dataRows.forEach((line, rowIdx) => {
    if (parsedCampaigns.length >= MAX_CAMPAIGNS) return;
    const values = line.split(',').map(v => v.trim());
    if (values.every(v => !v)) return;

    let campName = `Campaign ${parsedCampaigns.length + 1}`;
    let startDate = new Date().toISOString().split('T')[0];
    let endDate = new Date().toISOString().split('T')[0];
    const metrics = {};
    const manual = {};

    values.forEach((v, colIdx) => {
      const colType = headerMap[colIdx];
      if (!colType || v === '') return;

      if (colType === 'campaign') {
        campName = v || campName;
      } else if (colType === 'startDate') {
        if (v && !isNaN(Date.parse(v))) startDate = v;
      } else if (colType === 'endDate') {
        if (v && !isNaN(Date.parse(v))) endDate = v;
      } else {
        const num = parseFloat(v);
        if (isNaN(num)) {
          errors.push(`Row ${rowIdx + 2}: "${v}" is not a valid number for "${colType}".`);
        } else if (num < 0) {
          errors.push(`Row ${rowIdx + 2}: "${colType}" cannot be negative.`);
        } else {
          metrics[colType] = num;
          manual[colType] = true;
        }
      }
    });

    parsedCampaigns.push({
      id: parsedCampaigns.length + 1,
      name: campName,
      startDate,
      endDate,
      metrics,
      manual
    });
  });

  if (errors.length > 0) {
    csvValidationStatus = {
      type: 'error',
      message: `Validation failed:<br>• ${errors.slice(0, 3).join('<br>• ')}`
    };
    render();
    return;
  }

  if (parsedCampaigns.length === 0) {
    csvValidationStatus = { type: 'error', message: 'No valid data rows found in CSV.' };
    render();
    return;
  }

  // Populate campaigns (limit MAX_CAMPAIGNS)
  campaigns = parsedCampaigns.map((pc, i) => {
    manualFields[pc.id] = pc.manual;
    return {
      id: pc.id,
      name: pc.name,
      periods: [{
        startDate: pc.startDate,
        endDate: pc.endDate,
        metrics: pc.metrics
      }],
      activePeriodIndex: 0
    };
  });
  campaignCounter = campaigns.length;
  activeTab = campaigns[0].id;

  const rowCountNotice = dataRows.length > MAX_CAMPAIGNS
    ? ` (Note: First 3 of ${dataRows.length} campaigns imported due to 3-campaign maximum)`
    : '';

  csvValidationStatus = {
    type: 'success',
    message: `✓ Successfully loaded ${campaigns.length} campaign${campaigns.length > 1 ? 's' : ''}: <strong>${campaigns.map(c => escHtml(c.name)).join(', ')}</strong>.${rowCountNotice}`
  };

  inputMode = 'manual';
  render();
}
